name: Bitcoin V3 — Render and Verify

on:
  push:
    branches:
      - feat/bitcoin-explainer-v3-remotion
    paths:
      - 'src/compositions/BitcoinExplainerV3.tsx'
      - 'src/Root.tsx'
      - '.github/workflows/bitcoin-v3-render.yml'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/compositions/BitcoinExplainerV3.tsx'
      - 'src/Root.tsx'
      - '.github/workflows/bitcoin-v3-render.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install browser dependencies
        run: npx remotion browser ensure

      - name: Render review frames
        run: |
          mkdir -p out
          npx remotion still src/index.ts BitcoinExplainerV3 out/bitcoin-v3-frame30.png --frame=30
          npx remotion still src/index.ts BitcoinExplainerV3 out/bitcoin-v3-frame90.png --frame=90
          npx remotion still src/index.ts BitcoinExplainerV3 out/bitcoin-v3-frame175.png --frame=175
          npx remotion still src/index.ts BitcoinExplainerV3 out/bitcoin-v3-frame265.png --frame=265

      - name: Render silent test
        run: npx remotion render src/index.ts BitcoinExplainerV3 out/bitcoin-v3-silent.mp4 --codec=h264 --concurrency=2

      - name: Verify video properties
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration -of json out/bitcoin-v3-silent.mp4 | tee out/video-metadata.json
          python3 - <<'PY'
          import json, subprocess
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,nb_frames','-show_entries','format=duration','-of','json','out/bitcoin-v3-silent.mp4']))
          v=info['streams'][0]
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['r_frame_rate']=='30/1',v
          assert int(v['nb_frames'])==300,v
          assert abs(float(info['format']['duration'])-10)<0.05,info
          print('PASS: 1080x1920, 30 fps, 300 frames, 10 seconds')
          PY

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v3-render-review
          path: out/
          if-no-files-found: warn
          retention-days: 14
