name: Render V09 visual prototype

on:
  push:
    branches: [main]
    paths: ['render-requests/v09.json']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate request
        run: |
          python - <<'PY'
          import json
          r=json.load(open('render-requests/v09.json'))
          assert r['episode']=='v09' and r['status']=='queued'
          PY
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mesa-vulkan-drivers unzip
          curl -fL --retry 3 https://github.com/mirage-hq/tesseract/releases/download/v0.3.0/tesseract-0.3.0-linux-x86_64.zip -o /tmp/tesseract.zip
          unzip -q /tmp/tesseract.zip -d /tmp/tesseract
          bash /tmp/tesseract/tesseract-0.3.0-linux-x86_64/install.sh
      - name: Build prototype
        run: |
          mkdir -p motion-prototypes/v09-rls/Previews
          cp motion-prototypes/mcp-full-episode/V04-MCP.tsrct motion-prototypes/v09-rls/V09-RLS.tsrct
          python motion-prototypes/v09-rls/.tesseract-work/build.py
          TSRCT="$HOME/.local/share/Tesseract/bin/tsrct"
          "$TSRCT" project commit --project motion-prototypes/v09-rls/V09-RLS.tsrct --file motion-prototypes/v09-rls/.tesseract-work/document.json
          "$TSRCT" project apply --project motion-prototypes/v09-rls/V09-RLS.tsrct --actions motion-prototypes/v09-rls/.tesseract-work/animation.json
      - name: Render prototype
        run: |
          TSRCT="$HOME/.local/share/Tesseract/bin/tsrct"
          ICD=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1 || true)
          if [ -n "$ICD" ]; then export VK_ICD_FILENAMES="$ICD"; fi
          "$TSRCT" export --project motion-prototypes/v09-rls/V09-RLS.tsrct --resolution 1080p --fps 30 --encoder-backend external-ffmpeg-command --ffmpeg-path /usr/bin/ffmpeg --output motion-prototypes/v09-rls/V09-RLS-Prototype.mp4
          "$TSRCT" filmstrip --project motion-prototypes/v09-rls/V09-RLS.tsrct --timestamps-ms 1200,4200,7000,9200,12400,15000,17400 --tile-width 270 --tile-height 480 --items-per-row 4 --output motion-prototypes/v09-rls/Previews/Filmstrip.png
      - uses: actions/upload-artifact@v4
        with:
          name: v09-rls-prototype
          path: |
            motion-prototypes/v09-rls/V09-RLS-Prototype.mp4
            motion-prototypes/v09-rls/V09-RLS.tsrct
            motion-prototypes/v09-rls/Previews/Filmstrip.png
          retention-days: 14
