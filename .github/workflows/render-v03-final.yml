name: Render V03 Final 4K
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'render-requests/v03.json'
permissions:
  contents: read
concurrency:
  group: creator-os-v03-render
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.request.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        name: Check episode readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('render-requests/v03.json', 'utf8'));
          if (request.episode !== 'v03' || typeof request.requestId !== 'string' || !request.requestId.trim()) {
            throw new Error('Invalid V03 render request.');
          }
          const ready = process.env.EVENT_NAME === 'workflow_dispatch' || request.status === 'ready';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          console.log(`V03 request ${request.requestId}: ${ready ? 'render' : 'skip'}`);
          NODE
  render:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-lite-tts
      GEMINI_TTS_FALLBACK_MODEL: gemini-3.8-flash-tts
      GEMINI_TTS_VOICE: Sulafat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify narration configuration
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi
      - run: npm install
      - run: npm run voice:v03 -- --dry-run
      - name: Generate narration and measure scene timing
        run: npm run voice:v03
      - name: Generate semantic sound cues
        run: npm run sound:v03
      - name: Install mastering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run typecheck
      - name: Render narrated final mix
        run: npm run render:v03:final:4k
      - name: Two-pass loudness master and media verification
        run: npm run master:v03
      - name: Preserve review package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v03-final-4k-review-package
          path: |
            out/v03-final-master-4k.mp4
            out/v03-loudness-qa.txt
            out/v03-media-qa.json
            public/audio/v03
            public/audio/v03-sfx/manifest.json
            src/generated/v03-audio.ts
          if-no-files-found: error
          retention-days: 14
