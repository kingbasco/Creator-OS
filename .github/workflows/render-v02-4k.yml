name: Render V02 4K Voiced

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore approved V02 narration
        run: |
          mkdir -p /tmp/v02-source
          gh run download 36651950699 -n v02-voice-aligned-render -D /tmp/v02-source
          rm -rf public/audio/v02
          mkdir -p public/audio
          cp -R /tmp/v02-source/public/audio/v02 public/audio/v02
          node scripts/hydrate-v02-audio.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Render native 4K voiced V02
        run: npm run render:v02:voiced:4k

      - name: Upload 4K master
        uses: actions/upload-artifact@v4
        with:
          name: v02-voiced-4k-master
          path: out/v02-voiced-4k.mp4
          if-no-files-found: error
          retention-days: 14
