name: Render V03 Motion Preview
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run voice:v03 -- --dry-run
      - run: npm run render:v03:4k
      - uses: actions/upload-artifact@v4
        with:
          name: v03-silent-motion-preview-4k
          path: out/v03-4k.mp4
          if-no-files-found: error
          retention-days: 14
