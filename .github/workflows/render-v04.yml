name: Render V04 and deliver to Drive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or final
        type: choice
        options: [preview, final]
        default: preview
  push:
    branches: [main]
    paths: ['render-requests/v04.json']

permissions:
  contents: read

concurrency:
  group: creator-os-v04-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve render mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('render-requests/v04.json'))
          if r.get('episode')!='v04':
              raise SystemExit('Invalid V04 request')
          mode=(os.environ.get('MANUAL_MODE') or '').strip() if os.environ.get('EVENT_NAME')=='workflow_dispatch' else ('final' if r.get('status')=='ready' else 'preview')
          if mode not in ('preview','final'):
              raise SystemExit('Invalid mode')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('MODE='+mode+'\n')
              if mode=='final':
                  voice=r.get('voicePackageId','')
                  if not voice:
                      raise SystemExit('Final V04 needs voicePackageId')
                  f.write('VOICE_PACKAGE_ID='+voice+'\n')
          print('V04 mode:',mode)
          PY
      - name: Preflight
        run: |
          python scripts/test-calendar-worker.py
          python scripts/test-deliver-render.py
      - name: Install dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg mesa-vulkan-drivers unzip
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Render preview
        if: env.MODE == 'preview'
        run: npx remotion render src/index.ts V04-MCP-Preview out/v04-motion-preview-1080p.mp4 --codec=h264 --crf=19 --concurrency=2
      - name: Reuse verified narration
        if: env.MODE == 'final'
        run: python scripts/hydrate-v04-audio.py --file-id "$VOICE_PACKAGE_ID"
      - name: Generate deterministic sound assets
        if: env.MODE == 'final'
        run: node scripts/generate-v04-sfx.mjs
      - name: Install Tesseract 0.3.0
        if: env.MODE == 'final'
        run: |
          curl -fL --retry 3 https://github.com/mirage-hq/tesseract/releases/download/v0.3.0/tesseract-0.3.0-linux-x86_64.zip -o /tmp/tesseract.zip
          unzip -q /tmp/tesseract.zip -d /tmp/tesseract
          bash /tmp/tesseract/tesseract-0.3.0-linux-x86_64/install.sh
          "$HOME/.local/share/Tesseract/bin/tsrct" --version
      - name: Export approved Tesseract visual
        if: env.MODE == 'final'
        run: |
          mkdir -p out
          TSRCT="$HOME/.local/share/Tesseract/bin/tsrct"
          PROJECT="motion-prototypes/mcp-full-episode/V04-MCP.tsrct"
          ICD=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1 || true)
          if [ -n "$ICD" ]; then export VK_ICD_FILENAMES="$ICD"; fi
          "$TSRCT" export --project "$PROJECT" --resolution 1080p --fps 30 --encoder-backend external-ffmpeg-command --ffmpeg-path /usr/bin/ffmpeg --output out/v04-tesseract-visual-1080p.mp4
      - name: Sync visual scenes to narration and mix sound
        if: env.MODE == 'final'
        run: |
          python scripts/mix-v04-tesseract.py
          node scripts/master-v04.mjs
      - name: Preserve review media
        uses: actions/upload-artifact@v4
        with:
          name: v04-${{ env.MODE }}-review-media
          path: |
            out/v04-motion-preview-1080p.mp4
            out/v04-final-master-4k.mp4
            out/v04-media-qa.json
            out/v04-loudness-qa.txt
            out/v04-timing.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Drive upload and update calendar
        run: |
          python - <<'PY'
          import json, os, subprocess
          mode=os.environ['MODE']
          request=json.load(open('render-requests/v04.json'))
          file='out/v04-final-master-4k.mp4' if mode=='final' else 'out/v04-motion-preview-1080p.mp4'
          request_id=request['requestId']+('-final' if mode=='final' else '')
          subprocess.run(['python','scripts/deliver-render.py','--file',file,'--mode',mode,'--request-id',request_id],check=True)
          PY
      - name: Preserve delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-${{ env.MODE }}-delivery-receipt
          path: out/v04-delivery.json
          if-no-files-found: ignore
          retention-days: 14
