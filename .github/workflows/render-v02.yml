name: Render V02
# final sweep QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-v02.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Render V02
        run: npm run render:v02

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: v02-transition-preview
          path: out/v02-silent.mp4
          if-no-files-found: error
          retention-days: 14
