name: Render V02 Final 4K

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore approved V02 narration
        run: |
          mkdir -p /tmp/v02-source
          gh run download 36651950699 -n v02-voice-aligned-render -D /tmp/v02-source
          rm -rf public/audio/v02
          mkdir -p public/audio
          cp -R /tmp/v02-source/public/audio/v02 public/audio/v02
          node scripts/hydrate-v02-audio.mjs

      - name: Generate owned V02 sound design
        run: npm run sound:v02

      - name: Install mastering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Type-check
        run: npm run typecheck

      - name: Render 4K final mix
        run: npm run render:v02:final:4k

      - name: Loudness master
        run: npm run master:v02

      - name: Upload final master
        uses: actions/upload-artifact@v4
        with:
          name: v02-final-4k-master
          path: |
            out/v02-final-master-4k.mp4
            public/audio/v02-sfx/manifest.json
          if-no-files-found: error
          retention-days: 14
