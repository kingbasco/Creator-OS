name: Creator OS daily queue check

on:
  schedule:
    # 08:17 Lagos (07:17 UTC), once a day to minimize usage.
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/calendar-worker.py
      - scripts/test-calendar-worker.py
      - .github/workflows/calendar-worker.yml

permissions:
  contents: read

concurrency:
  group: creator-os-calendar-worker
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify selection and duplicate detection
        run: python scripts/test-calendar-worker.py
      - name: Inspect calendar and render folder
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/calendar-worker.py
